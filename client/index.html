<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7fc" />

    <!-- Search. Per-page title/description/canonical are updated in src/lib/seo.js. -->
    <title>Swipe Hire – Best Hiring Platform &amp; Job App in India</title>
    <meta name="description" content="Find the best job opportunities and hire faster. Companies swipe through resumes and 15-second video intros; candidates get shortlisted without endless applications." />
    <meta name="keywords" content="best hiring platform, best job opportunities, hiring platform India, job app, find jobs, hire candidates fast, video resume, jobs for freshers, recruitment app, swipe to hire" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="application-name" content="Swipe Hire" />
    <meta name="apple-mobile-web-app-title" content="Swipe Hire" />
    <!-- Google Search Console: paste your verification code here after adding the site.
    <meta name="google-site-verification" content="YOUR-CODE" /> -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swipe Hire" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Swipe Hire – Best Hiring Platform &amp; Job App in India" />
    <meta property="og:description" content="Companies swipe through resumes and 15-second intro videos. Job seekers find the best job opportunities without sending a hundred applications." />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Swipe Hire – hiring at the speed of a swipe" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swipe Hire – Best Hiring Platform &amp; Job App in India" />
    <meta name="twitter:description" content="Companies swipe through resumes and 15-second intro videos. Job seekers find the best job opportunities without endless applications." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- Structured data: who we are, the site, and the product with its price. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Swipe Hire",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/brand/swipehire-logo.png",
            "slogan": "Right swipe, right job."
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "name": "Swipe Hire",
            "url": "__SITE_URL__/",
            "inLanguage": "en-IN",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          },
          {
            "@type": "WebApplication",
            "name": "Swipe Hire",
            "url": "__SITE_URL__/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, Android, iOS",
            "description": "A hiring platform where companies swipe through candidate resumes and 15-second intro videos to shortlist faster, and job seekers find the best job opportunities.",
            "offers": [
              { "@type": "Offer", "name": "Job seekers", "price": "0", "priceCurrency": "INR" },
              { "@type": "Offer", "name": "Starter (150 swipes)", "price": "399", "priceCurrency": "INR" }
            ],
            "publisher": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>

    <script>
      // Saved light/dark choice, applied before the first paint (see src/lib/theme.js).
      try {
        if (localStorage.getItem('swipehire_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#07070d';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown to visitors and crawlers that don't run JavaScript. -->
    <noscript>
      <h1>Swipe Hire – the best hiring platform and job app in India</h1>
      <p>Companies swipe through candidate resumes and 15-second intro videos to shortlist the right people in minutes. Job seekers create one profile and find the best job opportunities without sending hundreds of applications. Free for job seekers; companies start with free swipes.</p>
      <p><a href="/auth">Sign up or log in</a></p>
      <p>Please enable JavaScript to use Swipe Hire.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
